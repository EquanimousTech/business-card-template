<a-scene
  main-comp
  xrextras-gesture-detector
  landing-page
  xrextras-loading
  xrextras-runtime-error
  renderer="colorManagement:true; webgl2: true;"
  xrweb="disableWorldTracking: false">
  <a-assets>
    <video
      src="./assets/Vid/vid.mp4"
      preload="auto"
      id="vid"
      response-type="arraybuffer"
      crossorigin
      webkit-playsinline
      playsinline></video>

    <img id="play" src="assets/Icons/playBtn.png" crossorigin="anonymous" />
    <img id="linkedinIcon" src="assets/Icons/linkedin.png" crossorigin="anonymous" />
    <img id="twitterIcon" src="assets/Icons/twitter.png" crossorigin="anonymous" />

    <img id="mailIcon" src="assets/Icons/mail.png" crossorigin="anonymous" />
    <img id="callIcon" src="assets/Icons/call.png" crossorigin="anonymous" />
    <img id="webIcon" src="assets/Icons/web.png" crossorigin="anonymous" />
    <img id="podCastIcon" src="assets/Icons/podcast.png" crossorigin="anonymous" />

    <img id="aboutUsBtnImg" src="assets/Img/aboutUsBtn.png" crossorigin="anonymous" />
    <img id="servicesBtnImg" src="assets/Img/servicesBtn.png" crossorigin="anonymous" />

    <img id="logoImg" src="assets/Icons/logo.png" crossorigin="anonymous" />

    <img id="aboutusImg" src="assets/Img/aboutus.png" crossorigin="anonymous" />
    <img id="servicesImg" src="assets/Img/services.png" crossorigin="anonymous" />
    <img id="arrowImg" src="assets/Img/arrow.png" crossorigin="anonymous" />

    <img id="text1Img" src="assets/Img/marcVerbenkov.png" crossorigin="anonymous" />
    <img id="text2Img" src="assets/Img/Founder.png" crossorigin="anonymous" />
    <img id="text3Img" src="assets/Img/principalFuturist.png" crossorigin="anonymous" />
    <img id="text4Img" src="assets/Img/podcastHost.png" crossorigin="anonymous" />
  </a-assets>

  <a-camera
    position="0 0 5"
    raycaster="objects: .clickable"
    cursor="fuse: false; rayOrigin: mouse;">
  </a-camera>

  <a-light type="directional" intensity="0.5" position="1 1 1"></a-light>

  <a-light type="ambient" intensity="0.7"></a-light>

  <!-- <xrextras-named-image-target name="targetImg"> -->
  <a-entity id="root" img-slam>
    <a-plane
      material="src: #vid; opacity: 1"
      position="-0.1 0 0"
      rotation="0 0 0"
      width="1.26"
      height="0.73"
      geometry=""></a-plane>

    <a-entity
      id="logo"
      class="clickable"
      geometry="primitive: plane; height: 0.3; width: 1;"
      position="0 0 -0.1"
      rotation="0 0 0"
      material="src: #logoImg; opacity: 1; transparent: true;"></a-entity>

    <a-entity
      id="playbtn"
      class="clickable"
      geometry="primitive: plane; height: 0.2; width: 0.2;"
      position="-0.09 0 0.1"
      rotation="0 0 0"
      material="src: #play; opacity: 1; transparent: true;"></a-entity>

    <a-entity
      id="linkedInBtn"
      class="clickable"
      geometry="primitive: plane; height: 0.25; width: 0.25;"
      position="0 0 -0.1"
      rotation="0 0 0"
      material="src: #linkedinIcon; opacity: 1; transparent: true;"></a-entity>

    <a-entity
      id="twitterBtn"
      class="clickable"
      geometry="primitive: plane; height: 0.25; width: 0.25;"
      position="0 0 -0.1"
      rotation="0 0 0"
      material="src: #twitterIcon; opacity: 1; transparent: true;"></a-entity>

    <a-entity
      id="aboutUsBtn"
      class="clickable"
      geometry="primitive: plane; height: 0.15; width: 0.5;"
      position="-0.35 -0.8 0"
      rotation="0 0 0"
      material="src: #aboutUsBtnImg; opacity: 1; transparent: true;"></a-entity>

    <a-plane
      id="aboutUsArrow"
      visible="false"
      height="0.5"
      width="0.1"
      position="0 -0.8 -0.01"
      src="#arrowImg"
      material="transparent: true"
      geometry=""
      rotation="0 0 90"></a-plane>

    <a-plane
      id="aboutusPlane"
      scale="0 0 0"
      height="0.5"
      width="1.3"
      position="0 -0.8 0"
      src="#aboutusImg"
      material=""
      geometry=""
      animation=""></a-plane>

    <a-entity
      id="servicesBtn"
      class="clickable"
      geometry="primitive: plane; height: 0.17; width: 0.5;"
      position="1 0.3 0"
      rotation="0 0 0"
      material="src: #servicesBtnImg; opacity: 1; transparent: true;"></a-entity>

    <a-plane
      visible="false"
      id="servicesArrow"
      height="0.5"
      width="0.1"
      position="1 0.3 0"
      src="#arrowImg"
      material="transparent: true"
      geometry=""></a-plane>

    <a-plane
      id="servicesPlane"
      scale="0 0 0"
      visible="false"
      height="0.7"
      width="0.7"
      position="1 0.3 0"
      src="#servicesImg"
      material=""
      geometry=""></a-plane>

    <a-plane
      id="text1"
      height="0.1"
      width="1"
      position="0 0 -0.1"
      material="src: #text1Img; transparent: true;"></a-plane>

    <a-plane
      id="qualificationText"
      height="auto"
      width="1.25"
      position="0 0 -0.1"
      text="value:CFP, APF, MA; color: white; width: 1.2;"
      color="#545454">
    </a-plane>

    <a-plane
      id="text2"
      height="0.1"
      width="1"
      position="0 0 -0.1"
      material="src: #text2Img; transparent: true;"></a-plane>

    <a-plane
      id="text3"
      height="0.1"
      width="1"
      position="0 0 -0.1"
      material="src: #text3Img; transparent: true;"></a-plane>

    <a-plane
      id="text4"
      height="0.1"
      width="1"
      position="0 0 -0.1"
      material="src: #text4Img; transparent: true;"></a-plane>

    <!-- <a-text
      id="text1"
      color="black"
      position="-1.5 0.2 0"
      height="1"
      width="2"
      value="Marc Verbenkov"
      text=""></a-text> -->

    <!-- <a-text
      id="text2"
      color="black"
      position="-1.4 0 0"
      height="1"
      width="2"
      value="Founder"
      text=""></a-text>
    <a-text
      id="text3"
      color="black"
      position="-1.4 -0.2 0"
      height="1"
      width="2"
      value="Principal Futurist"
      text=""></a-text>
    <a-text
      id="text4"
      color="black"
      position="-1.2 -0.4 0"
      height="1"
      width="2"
      value="Podcast Host"
      text=""></a-text> -->
    <a-entity id="BtnsRoot">
      <a-entity
        id="callBtn"
        class="clickable"
        geometry="primitive: plane; height: 0.12; width: 1;"
        position="0 0 -0.5"
        rotation="0 0 0"
        material="src: #callIcon; opacity: 1; transparent: true;"></a-entity>

      <a-entity
        id="mailBtn"
        class="clickable"
        geometry="primitive: plane; height: 0.12; width: 1;"
        position="0 0 -0.5"
        rotation="0 0 0"
        material="src: #mailIcon; opacity: 1; transparent: true;"></a-entity>

      <a-entity
        id="webBtn"
        class="clickable"
        geometry="primitive: plane; height: 0.12; width: 1;"
        position="0 0 -0.5"
        rotation="0 0 0"
        material="src: #webIcon; opacity: 1; transparent: true;"></a-entity>

      <a-entity
        id="podcastBtn"
        class="clickable"
        geometry="primitive: plane; height: 0.12; width: 1;"
        position="0 0 -0.5"
        rotation="0 0 0"
        material="src: #podCastIcon; opacity: 1; transparent: true;"></a-entity>
    </a-entity>
  </a-entity>
  <!-- </xrextras-named-image-target> -->
</a-scene>
